name: "Harness & LLM Evaluation"

on:
  workflow_dispatch:
    inputs:
      scenario:
        type: string
        default: "s1"
        description: "Scenario ID to run (e.g. s1, or all)"
      model:
        type: string
        default: "gemini/gemini-3.5-flash"
        description: "LiteLLM model identifier"
      judge_model:
        type: string
        default: "gemini/gemini-3.1-pro-preview"
        description: "LiteLLM judge model identifier"
      run_claude_vertex:
        type: boolean
        default: true
        description: "Run Claude Sonnet 5.5 Vertex AI job on self-hosted runner"

permissions:
  contents: read

jobs:
  eval-gemini:
    name: "Evaluate Gemini (LiteLLM)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: "Install dependencies"
        run: pip install -r requirements-dev.txt
      - name: "Run LiteLLM eval runner"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_SCENARIO: ${{ inputs.scenario }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model }}
        run: |
          ARGS=(--model "$EVAL_MODEL")
          if [ -n "$EVAL_JUDGE_MODEL" ]; then
            ARGS+=(--judge-model "$EVAL_JUDGE_MODEL")
          fi
          if [ -n "$EVAL_SCENARIO" ] && [ "$EVAL_SCENARIO" != "all" ]; then
            ARGS+=(--scenario "$EVAL_SCENARIO")
          fi
          python3 tools/eval_runner.py "${ARGS[@]}"

  smoke-openai-compat:
    name: "Smoke Test OpenAI Compatibility"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: "Verify OpenAI-compatible Chat Completions endpoint"
        env:
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          BASE_URL="${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}"
          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "${BASE_URL%/}/chat/completions" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"gemini-3.5-flash\", \"messages\": [{\"role\": \"user\", \"content\": \"ping\"}], \"max_tokens\": 5}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::OpenAI-compatible Chat Completions endpoint returned HTTP $HTTP_STATUS"
            cat "$RESPONSE_FILE"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi
          echo "OpenAI-compatible Chat Completions endpoint returned HTTP 200."
          rm -f "$RESPONSE_FILE"
      - name: "Validate Codex plugin and marketplace manifests"
        run: |
          python3 -c '
          import json, pathlib
          p1 = pathlib.Path(".codex-plugin/plugin.json")
          p2 = pathlib.Path(".agents/plugins/marketplace.json")
          assert p1.exists(), f"Missing {p1}"
          assert p2.exists(), f"Missing {p2}"
          d1 = json.loads(p1.read_text(encoding="utf-8"))
          d2 = json.loads(p2.read_text(encoding="utf-8"))
          assert d1.get("name") == "egm", f"Expected plugin name egm, got {d1.get("name")}"
          assert d2.get("name") == "elephant-goldfish-model", f"Expected marketplace name elephant-goldfish-model, got {d2.get("name")}"
          assert any(p.get("name") == "egm" for p in d2.get("plugins", [])), "egm plugin missing in marketplace.json"
          print("Manifests validated successfully.")
          '

  eval-claude-vertex:
    name: "Evaluate Claude Sonnet 5.5 on Vertex AI"
    if: ${{ inputs.run_claude_vertex }}
    runs-on: [self-hosted, airrt-vertex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: "Verify Vertex AI Anthropic rawPredict endpoint"
        run: |
          TOKEN=$(curl -s -f -H "Metadata-Flavor: Google" \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "https://aiplatform.googleapis.com/v1/projects/airrt-team/locations/global/publishers/anthropic/models/claude-sonnet-5-5:rawPredict" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"anthropic_version\": \"vertex-2023-10-16\", \"messages\": [{\"role\": \"user\", \"content\": \"ping\"}], \"max_tokens\": 5}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Vertex rawPredict returned HTTP $HTTP_STATUS"
            cat "$RESPONSE_FILE"
            rm -f "$RESPONSE_FILE"
            exit 1
          fi
          echo "Vertex AI rawPredict returned HTTP 200."
          rm -f "$RESPONSE_FILE"
      - name: "Run headless Claude Code smoke check"
        env:
          CLAUDE_CODE_USE_VERTEX: "1"
          CLOUD_ML_REGION: "global"
          ANTHROPIC_VERTEX_PROJECT_ID: "airrt-team"
          ANTHROPIC_MODEL: "claude-sonnet-5-5@default"
        run: |
          claude -p "ping"
