name: "Harness & LLM Evaluation"
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: string
        default: "decision_matrix_generation"
      model:
        type: string
        default: "gemini/gemini-3.5-flash"
      judge_model:
        type: string
        default: "gemini/gemini-3.1-pro-preview"
      run_claude_vertex:
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/eval.yml"
      - "tools/eval_runner.py"
      - "tests/evals/**"

permissions:
  contents: read
jobs:
  eval-gemini:
    name: "Evaluate Gemini (LiteLLM)"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: "Run LiteLLM eval runner"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_SCENARIO: ${{ inputs.scenario || 'decision_matrix_generation' }}
          EVAL_MODEL: ${{ inputs.model || 'gemini/gemini-3.5-flash' }}
          EVAL_JUDGE_MODEL: ${{ inputs.judge_model || 'gemini/gemini-3.1-pro-preview' }}
        run: |
          ARGS=(--model "$EVAL_MODEL" --judge-model "$EVAL_JUDGE_MODEL")
          [ -n "$EVAL_SCENARIO" ] && [ "$EVAL_SCENARIO" != "all" ] && ARGS+=(--scenario "$EVAL_SCENARIO")
          python3 tools/eval_runner.py "${ARGS[@]}"

  smoke-openai-compat:
    name: "Smoke Test OpenAI Compatibility"
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Verify OpenAI Chat Completions & Codex manifests"
        env:
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          BASE_URL="${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}"
          curl -sS --fail-with-body -X POST "${BASE_URL%/}/chat/completions" -H "Authorization: Bearer $OPENAI_API_KEY"             -H "Content-Type: application/json" -d '{"model":"gemini-3.5-flash","messages":[{"role":"user","content":"ping"}],"max_tokens":5}'
          jq -e '.name == "egm"' .codex-plugin/plugin.json
          jq -e '.name == "elephant-goldfish-model" and any(.plugins[]; .name == "egm")' .agents/plugins/marketplace.json

  eval-claude-vertex:
    name: "Evaluate Claude Sonnet 5.5 on Vertex AI"
    if: github.event_name == 'workflow_dispatch' && inputs.run_claude_vertex
    runs-on: [self-hosted, airrt-vertex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Verify Vertex AI rawPredict & Claude Code"
        env:
          CLAUDE_CODE_USE_VERTEX: "1"
          CLOUD_ML_REGION: "global"
          ANTHROPIC_VERTEX_PROJECT_ID: "airrt-team"
          ANTHROPIC_MODEL: "claude-sonnet-5-5@default"
        run: |
          TOKEN=$(curl -sf -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" | jq -r .access_token)
          curl -sS --fail-with-body -X POST "https://aiplatform.googleapis.com/v1/projects/airrt-team/locations/global/publishers/anthropic/models/claude-sonnet-5-5:rawPredict"             -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"anthropic_version":"vertex-2023-10-16","messages":[{"role":"user","content":"ping"}],"max_tokens":5}'
          claude -p "ping"
