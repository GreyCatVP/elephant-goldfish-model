<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <style>
      @font-face {
        font-family: 'Google Sans Flex';
        src: url('../src/assets/fonts/google-sans-flex.woff2') format('woff2');
        font-weight: 100 1000;
      }
      :root {
        color-scheme: light;
        --font-display: 'Google Sans Flex', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
      }
      .og {
        box-sizing: border-box;
        inline-size: 1200px;
        block-size: 630px;
        padding: 72px 80px 70px;
        display: flex;
        flex-direction: column;
        font-family: var(--font-display);
        color: var(--md-sys-color-on-surface);
        background:
          radial-gradient(560px 280px at 640px 0, var(--md-sys-color-primary-container), transparent),
          var(--md-sys-color-surface);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 22px;
        font-weight: 500;
      }
      .brand svg {
        inline-size: 36px;
        block-size: 36px;
      }
      h1 {
        margin: auto 0;
        font-size: 84px;
        font-weight: 500;
        line-height: 1.04;
        letter-spacing: -0.025em;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 22px;
      }
      .tagline {
        color: var(--md-sys-color-on-surface-variant);
      }
      .domain {
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="11" cy="16" r="9" fill="var(--egm-color-elephant)"></circle>
          <circle cx="26" cy="16" r="4" fill="var(--egm-color-goldfish)"></circle>
        </svg>
        Elephant-Goldfish Model
      </div>
      <h1>Design with an elephant.<br />Review with a goldfish.</h1>
      <div class="foot">
        <span class="tagline">Spec-driven development with AI coding agents</span>
        <span class="domain">egm.dev</span>
      </div>
    </div>
  </body>
</html>
