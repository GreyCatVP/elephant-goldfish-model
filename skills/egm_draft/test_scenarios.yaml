skill: "egm_draft"
description: "Behavioral evaluation scenario suite for egm_draft skill."

scenarios:
  - scenario_id: "draft_and_write_design_doc"
    description: "Tests complete document generation matching the template structure."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
      rules:
        - "rules/anti_sycophancy.md"
    turns:
      - user_input: "Draft an initial design doc for adding rate limiting to the ingress API."
        assertions:
          - type: "required_pattern"
            pattern: "(Problem Statement|Overview|Goals|Non-Goals|Alternatives Considered)"
            message: "Draft must include standard design document sections."
          - type: "not_contains"
            pattern: "```python"
            message: "Drafting phase must not emit Python implementation code."

  - scenario_id: "artifact_first_delivery"
    description: "Asserts design drafts are written to artifacts rather than dumped in chat."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
    turns:
      - user_input: "Generate the design document for the rate limiter service."
        assertions:
          - type: "required_pattern"
            pattern: "(artifact|write_to_file|saved)"
            message: "Draft output should reference writing an artifact document."

  - scenario_id: "relative_link_formatting_spec"
    description: "Verifies proper relative link formatting across subdirectories and siblings."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_draft/SKILL.md"
    turns:
      - user_input: "How should links to sibling packages and subdirectories be formatted in our markdown docs?"
        assertions:
          - type: "required_pattern"
            pattern: "(\\./|\\.\\./|\\[.+?\\]\\(\\.\\.?/)"
            message: "Must recommend relative paths for intra-package/sibling links."
