skill: "goldfish_review_resolve"
description: "Behavioral evaluation scenario suite for goldfish_review_resolve skill."

scenarios:
  - scenario_id: "resolve_findings_gate"
    description: "Verifies review comments are systematically classified, addressed, and verified."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/goldfish_review_resolve/SKILL.md"
    turns:
      - user_input: "Run goldfish-review-resolve with TargetFile: docs/design.md, Finding: Missing SLO on line 2."
        assertions:
          - type: "required_pattern"
            pattern: "(report|findings|resolve|SLO|comment)"
            message: "Review resolve skill must compile review findings report and prompt user resolution."
