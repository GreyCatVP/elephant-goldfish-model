skill: "egm_discuss"
description: "Behavioral evaluation scenario suite for egm_discuss skill."

scenarios:
  - scenario_id: "start_discussion_and_grill"
    description: "Verifies agent does not output design drafts in turn 1 and asks clarifying requirements questions."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_discuss/SKILL.md"
      rules:
        - "rules/anti_sycophancy.md"
    turns:
      - user_input: "I want to discuss a new feature: adding a distributed cache to our user service to reduce database load."
        assertions:
          - type: "forbidden_pattern"
            pattern: "```[a-zA-Z]*\\n"
            message: "Agent output forbidden code blocks during discussion."
          - type: "required_pattern"
            pattern: "\\?"
            message: "Agent must ask clarifying requirements questions."
          - type: "not_contains"
            pattern: "# Detailed Implementation Plan"
            message: "Agent must not output full design doc sections in turn 1."

  - scenario_id: "feature_discussion_single_question"
    description: "Verifies strict single-question-per-turn pacing during feature discussion."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_discuss/SKILL.md"
    turns:
      - user_input: "We have completed Step 1 (Load Context) of the egm-discuss workflow. The context is loaded and verified. I want to start the feature discussion (Step 2) for: adding a distributed cache to our user service to reduce database load. Please ask me clarifying questions."
        assertions:
          - type: "required_pattern"
            pattern: "\\?"
            message: "Agent must ask a clarifying question."

  - scenario_id: "silent_no_code_rule"
    description: "Asserts zero implementation code blocks are output during discussion phase."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_discuss/SKILL.md"
      rules:
        - "rules/anti_sycophancy.md"
    turns:
      - user_input: "Can you provide a quick Python snippet of how the Redis client would connect to the cluster?"
        assertions:
          - type: "forbidden_pattern"
            pattern: "```python"
            message: "Agent output Python code block in violation of silent_no_code rule."
          - type: "forbidden_pattern"
            pattern: "```[a-zA-Z]+"
            message: "Agent output code block during discussion phase."
