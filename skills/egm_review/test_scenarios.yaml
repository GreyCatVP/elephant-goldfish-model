skill: "egm_review"
description: "Behavioral evaluation scenario suite for egm_review skill."

scenarios:
  - scenario_id: "comprehension_auditor_undefined_jargon"
    description: "Verifies comprehension critique flags undefined terminology."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_review/SKILL.md"
    turns:
      - user_input: "Review this draft: 'The synchronizer will save data to InternalDB using MagicSync.'"
        assertions:
          - type: "required_pattern"
            pattern: "(MagicSync|InternalDB)"
            message: "Comprehension auditor must flag undefined terminology MagicSync or InternalDB."

  - scenario_id: "design_critic_missing_slo"
    description: "Injects distributed architecture lacking SLOs/latencies; asserts design critic catches omissions."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_review/SKILL.md"
    turns:
      - user_input: "Review this design: 'We will store user profiles in a globally replicated database across multiple read replicas.'"
        assertions:
          - type: "required_pattern"
            pattern: "(SLO|latency|consistency|replication lag)"
            message: "Design critic must flag missing SLOs, latency targets, or replication lag risks."

  - scenario_id: "readiness_reviewer_vague_tasks"
    description: "Injects underspecified tasks; asserts readiness review flags non-actionable steps."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_review/SKILL.md"
    turns:
      - user_input: "Review implementation plan: '1. Write the client library. 2. Run verification.'"
        assertions:
          - type: "required_pattern"
            pattern: "(vague|actionable|underspecified|test|specific)"
            message: "Readiness review must flag non-actionable or vague implementation steps."

  - scenario_id: "structural_and_style_audit"
    description: "Verifies heading hierarchy, banned adjectives, and objective tone."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm_review/SKILL.md"
      rules:
        - "rules/anti_sycophancy.md"
    turns:
      - user_input: "Audit the style and structure of this design document draft."
        assertions:
          - type: "forbidden_pattern"
            pattern: "(brilliant|amazing|fantastic|great job)"
            message: "Style audit must adhere to anti-sycophancy rules and avoid flattery."
